<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism Paddock</title>
    <link href="./style.css" rel="stylesheet" />
    <link id="favIcon" rel="icon shortcut" />
  </head>
  <body>
    <main>
      <section id="title">
        <h1 class="sectionTitle">Prism Paddock</h1>

        <p class="p">
          <a href="#game">Click to start</a>
        </p>
      </section>

      <section id="game">
        <div id="top"></div>
        <div id="pad"></div>
        <div id="bar"></div>
      </section>
    </main>

    <p class="p" id="gameOptions">
      <label><input id="soundsCheckbox" type="checkbox" /> Enable sounds</label>
    </p>
    <script type="module" src="scripts/index.js"></script>
  </body>
</html>
